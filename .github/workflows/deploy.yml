name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: simplegant-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simplegant?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Run linters
        run: npm run lint

      - name: Build applications
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package deployment files
        run: |
          tar -czf "$RUNNER_TEMP/simplegant-${GITHUB_SHA}.tar.gz" \
            .dockerignore \
            .env.example \
            Dockerfile.api \
            Dockerfile.web \
            docker-compose.yml \
            nginx \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            apps

      - name: Upload deployment archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            "$RUNNER_TEMP/simplegant-${GITHUB_SHA}.tar.gz" \
            "$VPS_USER@$VPS_HOST:/tmp/simplegant-${GITHUB_SHA}.tar.gz"

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: /srv/simplegant
          DEPLOY_ARCHIVE: /tmp/simplegant-${{ github.sha }}.tar.gz
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_ARCHIVE='$DEPLOY_ARCHIVE' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ "$DEPLOY_PATH" != "/srv/simplegant" ]; then
            echo "Unexpected deploy path: $DEPLOY_PATH" >&2
            exit 1
          fi

          test -f "$DEPLOY_ARCHIVE"
          trap 'rm -f "$DEPLOY_ARCHIVE"' EXIT
          mkdir -p "$DEPLOY_PATH"

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "Missing $DEPLOY_PATH/.env" >&2
            echo "Create it from .env.example before the first deploy." >&2
            exit 1
          fi

          rm -rf "$DEPLOY_PATH/apps" "$DEPLOY_PATH/nginx"
          rm -f \
            "$DEPLOY_PATH/.dockerignore" \
            "$DEPLOY_PATH/.env.example" \
            "$DEPLOY_PATH/Dockerfile.api" \
            "$DEPLOY_PATH/Dockerfile.web" \
            "$DEPLOY_PATH/docker-compose.yml" \
            "$DEPLOY_PATH/package.json" \
            "$DEPLOY_PATH/package-lock.json" \
            "$DEPLOY_PATH/tsconfig.base.json"

          tar -xzf "$DEPLOY_ARCHIVE" -C "$DEPLOY_PATH"

          cd "$DEPLOY_PATH"
          docker compose build api web migrate
          docker compose --profile tools run --rm migrate
          docker compose up -d api web
          docker compose ps
          REMOTE

